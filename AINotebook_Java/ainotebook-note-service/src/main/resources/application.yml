server:
  port: 8081

spring:
  application:
    name: ainotebook-note-service
  datasource:
    url: jdbc:mysql://localhost:3306/ainotebook?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

ainotebook:
  jwt:
    secret: ainotebook-dev-secret
