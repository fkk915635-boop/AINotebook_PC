server:
  port: 8082

spring:
  application:
    name: ainotebook-auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/ainotebook?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

ainotebook:
  jwt:
    secret: ainotebook-dev-secret
    ttlMillis: 604800000
